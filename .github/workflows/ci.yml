name: CI

# Lightweight pipeline designed for the Spark free tier and modest machines:
# no secrets, no deploy step, no browser downloads, and a cached npm install.
# Typical wall time is under three minutes.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check (strict)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit, integration and security-rules tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Production bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          ls -1sh dist/assets | sort -k1 -h -r | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan
        run: npm run check:secrets

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
